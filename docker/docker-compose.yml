services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-clew}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-clew}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-clew}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # Celery worker — runs the pipeline tasks (process_logs, send_alerts)
  # Start manually in dev: celery -A workers.celery_app worker --loglevel=info
  # ---------------------------------------------------------------------------
  # worker:
  #   build: ..
  #   command: celery -A workers.celery_app worker --concurrency=${CELERY_CONCURRENCY:-2} --loglevel=info
  #   env_file: ../.env
  #   depends_on:
  #     postgres:
  #       condition: service_healthy
  #     redis:
  #       condition: service_healthy

  # ---------------------------------------------------------------------------
  # Celery beat — fires poll_all_clients every 15 min
  # Start manually in dev: celery -A workers.celery_app beat --loglevel=info
  # ---------------------------------------------------------------------------
  # beat:
  #   build: ..
  #   command: celery -A workers.beat beat --loglevel=info
  #   env_file: ../.env
  #   depends_on:
  #     - worker

volumes:
  postgres_data:
  redis_data:
