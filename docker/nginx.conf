# Clew: Nginx reverse proxy configuration
#
# Four virtual hosts:
#   clewsec.com            301 to https://www.clewsec.com
#   www.clewsec.com        marketing site, Next.js on :3000
#   dashboard.clewsec.com  the app, Next.js on :3000 (the Next.js proxy rewrites it to /dashboard)
#   api.clewsec.com        FastAPI on :8000 (webhooks and external API only)
#
# The browser calls the API same-origin at /api/* on www and dashboard. nginx
# strips the /api prefix and forwards to FastAPI. This must stay in nginx (never a
# Next.js rewrite) so FastAPI sees the real client IP in X-Forwarded-For.
#
# HTTP-only blocks here. After running Certbot:
#   sudo certbot --nginx -d clewsec.com -d www.clewsec.com -d dashboard.clewsec.com -d api.clewsec.com
# Certbot will automatically insert the HTTPS server blocks and HTTP to HTTPS redirects.
#
# Usage:
#   sudo cp docker/nginx.conf /etc/nginx/sites-available/clew
#   sudo ln -s /etc/nginx/sites-available/clew /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx

# ─────────────────────────────────────────────────────────────────────────────
# Apex: redirect to the canonical www host
# ─────────────────────────────────────────────────────────────────────────────
server {
    listen 80;
    server_name clewsec.com;

    return 301 https://www.clewsec.com$request_uri;
}

# ─────────────────────────────────────────────────────────────────────────────
# Marketing site  (Next.js)
# ─────────────────────────────────────────────────────────────────────────────
server {
    listen 80;
    server_name www.clewsec.com;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
    # script-src/frame-src allow Cloudflare Turnstile (registration + forgot-password
    # CAPTCHA) and Razorpay Checkout. connect-src is same-origin only (the browser
    # reaches the API at /api on this host) plus Turnstile and Razorpay. Next.js's own
    # hydration bootstrap needs 'unsafe-inline'/'unsafe-eval' (no nonce middleware set up).
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://challenges.cloudflare.com https://checkout.razorpay.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https://challenges.cloudflare.com https://*.razorpay.com; frame-src https://challenges.cloudflare.com https://*.razorpay.com; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;

    # Same-origin API: /api/x is forwarded to FastAPI as /x. The trailing slash on
    # proxy_pass is what strips the prefix. X-Forwarded-For is appended here (not by
    # Next.js) so the rate limiter sees the real client IP.
    location /api/ {
        client_max_body_size 10M;
        proxy_pass         http://127.0.0.1:8000/;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Next.js app
    location / {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection 'upgrade';
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
    }

    # Next.js static assets, longer cache
    location /_next/static/ {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        add_header         Cache-Control "public, max-age=31536000, immutable";
    }
}

# ─────────────────────────────────────────────────────────────────────────────
# Dashboard  (Next.js, the same process as the marketing site)
# ─────────────────────────────────────────────────────────────────────────────
server {
    listen 80;
    server_name dashboard.clewsec.com;

    # Security headers. The app is private, so keep it out of search engines.
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://challenges.cloudflare.com https://checkout.razorpay.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https://challenges.cloudflare.com https://*.razorpay.com; frame-src https://challenges.cloudflare.com https://*.razorpay.com; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;

    location = /robots.txt {
        default_type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    location /api/ {
        client_max_body_size 10M;
        proxy_pass         http://127.0.0.1:8000/;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location / {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection 'upgrade';
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
    }

    location /_next/static/ {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        add_header         Cache-Control "public, max-age=31536000, immutable";
    }
}

# ─────────────────────────────────────────────────────────────────────────────
# FastAPI backend (webhooks and external API only)
# ─────────────────────────────────────────────────────────────────────────────
server {
    listen 80;
    server_name api.clewsec.com;

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
    # Pure JSON API, /docs is disabled outside debug mode: deny everything by default.
    add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;

    # Increase body size limit for log upload payloads if needed
    client_max_body_size 10M;

    location / {
        proxy_pass         http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
