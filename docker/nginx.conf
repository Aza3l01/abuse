# Clew — Nginx reverse proxy configuration
#
# Two virtual hosts:
#   yourdomain.com        → Next.js on :3000
#   api.yourdomain.com    → FastAPI on :8000
#
# HTTP-only blocks here. After running Certbot:
#   sudo certbot --nginx -d yourdomain.com -d www.yourdomain.com -d api.yourdomain.com
# Certbot will automatically insert the HTTPS server blocks and HTTP→HTTPS redirects.
#
# Usage:
#   sudo cp docker/nginx.conf /etc/nginx/sites-available/clew
#   sudo ln -s /etc/nginx/sites-available/clew /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx

# ─────────────────────────────────────────────────────────────────────────────
# Marketing site + dashboard  (Next.js)
# ─────────────────────────────────────────────────────────────────────────────
server {
    listen 80;
    server_name yourdomain.com www.yourdomain.com;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
    # script-src/frame-src allow Cloudflare Turnstile (registration + forgot-password
    # CAPTCHA) and Razorpay Checkout; connect-src allows the API origin. Next.js's own
    # hydration bootstrap needs 'unsafe-inline'/'unsafe-eval' (no nonce middleware set up).
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://challenges.cloudflare.com https://checkout.razorpay.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https://api.yourdomain.com https://challenges.cloudflare.com https://*.razorpay.com; frame-src https://challenges.cloudflare.com https://*.razorpay.com; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;

    # Next.js app
    location / {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection 'upgrade';
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
    }

    # Next.js static assets — longer cache
    location /_next/static/ {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        add_header         Cache-Control "public, max-age=31536000, immutable";
    }
}

# ─────────────────────────────────────────────────────────────────────────────
# FastAPI backend
# ─────────────────────────────────────────────────────────────────────────────
server {
    listen 80;
    server_name api.yourdomain.com;

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
    # Pure JSON API, /docs is disabled outside debug mode: deny everything by default.
    add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;

    # Increase body size limit for log upload payloads if needed
    client_max_body_size 10M;

    location / {
        proxy_pass         http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
