# Clew: Nginx reverse proxy configuration
#
# Five virtual hosts:
#   clewsec.com            301 to https://www.clewsec.com
#   www.clewsec.com        marketing site, Next.js on :3000
#   dashboard.clewsec.com  the app, Next.js on :3000 (the Next.js proxy rewrites it to /dashboard)
#   api.clewsec.com        FastAPI on :8000 (webhooks and external API only)
#   internal.clewsec.com   staff ops panel (Phase 6), Next.js on :3000 plus FastAPI /internal/*
#
# The browser calls the API same-origin at /api/* on www and dashboard. nginx
# strips the /api prefix and forwards to FastAPI. This must stay in nginx (never a
# Next.js rewrite) so FastAPI sees the real client IP in X-Forwarded-For.
#
# The FastAPI /internal/* routes (staff ops) are reachable ONLY through the
# internal host: every other host returns 404 for them.
#
# HTTP-only blocks here. After running Certbot, expanding the EXISTING certificate:
#   sudo certbot --nginx --expand -d clewsec.com -d www.clewsec.com -d dashboard.clewsec.com -d api.clewsec.com -d internal.clewsec.com
# Certbot will automatically insert the HTTPS server blocks and HTTP to HTTPS redirects.
#
# Usage:
#   sudo cp docker/nginx.conf /etc/nginx/sites-available/clew
#   sudo ln -s /etc/nginx/sites-available/clew /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx

# ─────────────────────────────────────────────────────────────────────────────
# Apex: redirect to the canonical www host
# ─────────────────────────────────────────────────────────────────────────────
server {
    listen 80;
    server_name clewsec.com;

    return 301 https://www.clewsec.com$request_uri;
}

# ─────────────────────────────────────────────────────────────────────────────
# Marketing site  (Next.js)
# ─────────────────────────────────────────────────────────────────────────────
server {
    listen 80;
    server_name www.clewsec.com;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
    # The Content-Security-Policy for this host is set by the Next.js proxy
    # (frontend/src/proxy.ts) with a per-request nonce. Do not add one here: two
    # policies would both be enforced.

    # Same-origin API: /api/x is forwarded to FastAPI as /x. The trailing slash on
    # proxy_pass is what strips the prefix. X-Forwarded-For is appended here (not by
    # Next.js) so the rate limiter sees the real client IP.
    # Staff ops API: internal host only.
    location ^~ /api/internal/ {
        return 404;
    }

    location /api/ {
        client_max_body_size 10M;
        proxy_pass         http://127.0.0.1:8000/;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Next.js app
    location / {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection 'upgrade';
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
    }

    # Next.js static assets, longer cache
    location /_next/static/ {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        add_header         Cache-Control "public, max-age=31536000, immutable";
    }
}

# ─────────────────────────────────────────────────────────────────────────────
# Dashboard  (Next.js, the same process as the marketing site)
# ─────────────────────────────────────────────────────────────────────────────
server {
    listen 80;
    server_name dashboard.clewsec.com;

    # Security headers. The app is private, so keep it out of search engines.
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
    # CSP: set by the Next.js proxy (frontend/src/proxy.ts), not here.

    location = /robots.txt {
        default_type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    # Staff ops API: internal host only.
    location ^~ /api/internal/ {
        return 404;
    }

    location /api/ {
        client_max_body_size 10M;
        proxy_pass         http://127.0.0.1:8000/;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location / {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection 'upgrade';
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
    }

    location /_next/static/ {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        add_header         Cache-Control "public, max-age=31536000, immutable";
    }
}

# ─────────────────────────────────────────────────────────────────────────────
# Internal ops panel (Phase 6): staff only, the same Next.js process. The Next.js
# proxy serves /internal pages only on this host. Strict CSP: no third party
# scripts or frames at all (no Turnstile, no Razorpay).
# ─────────────────────────────────────────────────────────────────────────────
server {
    listen 80;
    server_name internal.clewsec.com;

    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
    # CSP: set by the Next.js proxy (frontend/src/proxy.ts), strict variant for this host.

    location = /robots.txt {
        default_type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    # /api/x is forwarded to FastAPI as /x, so /api/internal/x reaches /internal/x.
    # Only /api/internal/ is proxied: nothing else of the API is reachable here.
    location /api/internal/ {
        client_max_body_size 1M;
        proxy_pass         http://127.0.0.1:8000/internal/;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location /api/ {
        return 404;
    }

    location / {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection 'upgrade';
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
    }

    location /_next/static/ {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        add_header         Cache-Control "public, max-age=31536000, immutable";
    }
}

# ─────────────────────────────────────────────────────────────────────────────
# FastAPI backend (webhooks and external API only)
# ─────────────────────────────────────────────────────────────────────────────
server {
    listen 80;
    server_name api.clewsec.com;

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
    # Pure JSON API, /docs is disabled outside debug mode: deny everything by default.
    add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;

    # Increase body size limit for log upload payloads if needed
    client_max_body_size 10M;

    # Staff ops API: internal host only.
    location ^~ /internal/ {
        return 404;
    }

    location / {
        proxy_pass         http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
