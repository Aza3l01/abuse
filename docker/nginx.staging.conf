# Clew: Nginx configuration for the STAGING stack (same EC2 server as production)
#
# Staging is a second copy of the app on the same machine. It shares nothing
# with production except the box: its own checkout, its own Postgres database,
# its own Redis database index, its own ports and its own hostnames.
#
#   stg.clewsec.com            marketing site, Next.js on :3100
#   stg-dashboard.clewsec.com  the app, Next.js on :3100
#   stg-internal.clewsec.com   staff ops panel, Next.js on :3100 plus FastAPI /internal/*
#   stg-api.clewsec.com        FastAPI on :8100 (webhooks, for Razorpay TEST webhooks)
#
# Same rules as docker/nginx.conf: /api/* is proxied here (never a Next.js rewrite)
# so FastAPI sees the real client IP; /internal/* is reachable only on the internal
# host; the frontend Content-Security-Policy comes from the Next.js proxy, not nginx.
# Every host is noindex.
#
# After the DNS records exist, add the hosts to the EXISTING certificate:
#   sudo certbot --nginx --expand -d clewsec.com -d www.clewsec.com -d dashboard.clewsec.com \
#     -d api.clewsec.com -d internal.clewsec.com \
#     -d stg.clewsec.com -d stg-dashboard.clewsec.com -d stg-internal.clewsec.com -d stg-api.clewsec.com
#
# Usage:
#   sudo cp docker/nginx.staging.conf /etc/nginx/sites-available/clew-staging
#   sudo ln -s /etc/nginx/sites-available/clew-staging /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    server_name stg.clewsec.com;

    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;

    location = /robots.txt {
        default_type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    location ^~ /api/internal/ {
        return 404;
    }

    location /api/ {
        client_max_body_size 10M;
        proxy_pass         http://127.0.0.1:8100/;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location / {
        proxy_pass         http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection 'upgrade';
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
    }
}

